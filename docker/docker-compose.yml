name: fluxel
include:
  - docker-compose.core.yml

x-fluxel-env: &fluxel-env
  PORT: 80
  VALKEY: ${VALKEY:-valkey:6379}
  DATABASE_HOST: ${DATABASE_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_DATABASE: ${DATABASE_DATABASE:-fluxel}
  DATABASE_USERNAME: ${DATABASE_USERNAME:-fluxel}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
  URL_WEB: ${URL_WEB:-http://localhost:2400}
  URL_ASSETS: ${URL_ASSETS:-http://localhost:2400/assets}
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  
  FLUXEL_DISCORD_BOT_TOKEN: ${FLUXEL_DISCORD_BOT_TOKEN}
  FLUXEL_DISCORD_CLIENT_ID: ${FLUXEL_DISCORD_CLIENT_ID}
  FLUXEL_DISCORD_CLIENT_SECRET: ${FLUXEL_DISCORD_CLIENT_SECRET}
  FLUXEL_DISCORD_CHANNEL_LOGGING: ${FLUXEL_DISCORD_CHANNEL_LOGGING}
  FLUXEL_DISCORD_CHANNEL_REGISTRATIONS: ${FLUXEL_DISCORD_CHANNEL_REGISTRATIONS}
  FLUXEL_DISCORD_CHANNEL_SUBMISSIONS: ${FLUXEL_DISCORD_CHANNEL_SUBMISSIONS}
  FLUXEL_DISCORD_CHANNEL_RECORDS: ${FLUXEL_DISCORD_CHANNEL_RECORDS}
  FLUXEL_DISCORD_CHANNEL_RANKED: ${FLUXEL_DISCORD_CHANNEL_RANKED}
  FLUXEL_DISCORD_CHANNEL_QUEUE: ${FLUXEL_DISCORD_CHANNEL_QUEUE}
  FLUXEL_DISCORD_CHANNEL_CHAT: ${FLUXEL_DISCORD_CHANNEL_CHAT}
  
  FLUXEL_MAIL_HOST: ${FLUXEL_MAIL_HOST}
  FLUXEL_MAIL_PORT: ${FLUXEL_MAIL_PORT}
  FLUXEL_MAIL_USERNAME: ${FLUXEL_MAIL_USERNAME}
  FLUXEL_MAIL_PASSWORD: ${FLUXEL_MAIL_PASSWORD}
  FLUXEL_MAIL_NAME: ${FLUXEL_MAIL_NAME}
  
  FLUXEL_S3_URL: http://seaweedfs:8333
  FLUXEL_S3_ACCESS_KEY: fluxel
  FLUXEL_S3_SECRET_KEY: ${FLUXEL_S3_SECRET_KEY?set FLUXEL_S3_SECRET_KEY in .env}
  
  FLUXEL_STEAM_APP_ID: ${FLUXEL_STEAM_APP_ID}
  FLUXEL_STEAM_WEB_KEY: ${FLUXEL_STEAM_WEB_KEY}

x-fluxel-wait: &fluxel-wait
  valkey: { condition: service_healthy }
  postgres: { condition: service_healthy }
  postgres-init: { condition: service_completed_successfully }

x-fluxel-service: &fluxel-service
  user: "1000:1000"
  restart: ${FLUXEL_RESTART_BEHAVIOUR:-unless-stopped}
  networks: [ fluxel ]
  environment:
    UID: 1000
    GID: 1000

x-fluxel-healthcheck: &fluxel-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 90s

services:
  caddy:
    <<: *fluxel-service
    image: caddy:2.11-alpine
    ports:
      - "127.0.0.1:2400:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      <<: *fluxel-healthcheck
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/" ]
    depends_on:
      seaweedfs: { condition: service_started }
      atlas: { condition: service_started }
      beacon: { condition: service_started }
  
  admin:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Admin
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  api:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: API
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  atlas:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Atlas
    depends_on:
      <<: *fluxel-wait
      meilisearch: { condition: service_healthy }
    environment:
      <<: *fluxel-env
  
  beacon:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Beacon
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

  broadcast:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Broadcast
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  chronicle:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Chronicle
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  content:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Content
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

  discord:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Discord
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

  multiplayer:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Multiplayer
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env