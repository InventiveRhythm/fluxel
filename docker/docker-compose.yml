  api:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: API
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: [ *fluxel-db-env, *fluxel-env ]
      STEAM_APPID: ${STEAM_APPID}
      STEAM_WEBKEY: ${STEAM_WEBKEY}
  
  atlas:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Atlas
    depends_on:
      <<: *fluxel-wait
      meilisearch: { condition: service_healthy }
    environment:
      <<: [ *fluxel-db-env, *fluxel-env ]
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  
  beacon:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Beacon
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: [ *fluxel-db-env, *fluxel-env ]

  broadcast:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Broadcast
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: [ *fluxel-db-env, *fluxel-env ]
  
