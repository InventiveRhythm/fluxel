name: fluxel

x-fluxel-env: &fluxel-env
  PORT: 80
  VALKEY: ${VALKEY:-valkey:6379}
  DATABASE_HOST: ${DATABASE_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_DATABASE: ${DATABASE_DATABASE:-fluxel}
  DATABASE_USERNAME: ${DATABASE_USERNAME:-fluxel}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
  URL_WEB: ${URL_WEB:-http://localhost:2400}
  URL_ASSETS: ${URL_ASSETS:-http://localhost:2400/assets}
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  
  FLUXEL_DISCORD_BOT_TOKEN: ${FLUXEL_DISCORD_BOT_TOKEN}
  FLUXEL_DISCORD_CLIENT_ID: ${FLUXEL_DISCORD_CLIENT_ID}
  FLUXEL_DISCORD_CLIENT_SECRET: ${FLUXEL_DISCORD_CLIENT_SECRET}
  FLUXEL_DISCORD_CHANNEL_LOGGING: ${FLUXEL_DISCORD_CHANNEL_LOGGING}
  FLUXEL_DISCORD_CHANNEL_REGISTRATIONS: ${FLUXEL_DISCORD_CHANNEL_REGISTRATIONS}
  FLUXEL_DISCORD_CHANNEL_SUBMISSIONS: ${FLUXEL_DISCORD_CHANNEL_SUBMISSIONS}
  FLUXEL_DISCORD_CHANNEL_RECORDS: ${FLUXEL_DISCORD_CHANNEL_RECORDS}
  FLUXEL_DISCORD_CHANNEL_RANKED: ${FLUXEL_DISCORD_CHANNEL_RANKED}
  FLUXEL_DISCORD_CHANNEL_QUEUE: ${FLUXEL_DISCORD_CHANNEL_QUEUE}
  FLUXEL_DISCORD_CHANNEL_CHAT: ${FLUXEL_DISCORD_CHANNEL_CHAT}
  
  FLUXEL_MAIL_HOST: ${FLUXEL_MAIL_HOST}
  FLUXEL_MAIL_PORT: ${FLUXEL_MAIL_PORT}
  FLUXEL_MAIL_USERNAME: ${FLUXEL_MAIL_USERNAME}
  FLUXEL_MAIL_PASSWORD: ${FLUXEL_MAIL_PASSWORD}
  FLUXEL_MAIL_NAME: ${FLUXEL_MAIL_NAME}
  
  FLUXEL_S3_URL: http://seaweedfs:8333
  FLUXEL_S3_ACCESS_KEY: ${FLUXEL_S3_ACCESS_KEY?-fluxel}
  FLUXEL_S3_SECRET_KEY: ${FLUXEL_S3_SECRET_KEY?set FLUXEL_S3_SECRET_KEY in .env}
  
  FLUXEL_STEAM_APP_ID: ${FLUXEL_STEAM_APP_ID}
  FLUXEL_STEAM_WEB_KEY: ${FLUXEL_STEAM_WEB_KEY}

x-fluxel-wait: &fluxel-wait
  valkey: { condition: service_healthy }
  postgres: { condition: service_healthy }
  postgres-init: { condition: service_completed_successfully }

x-fluxel-service: &fluxel-service
  user: "1000:1000"
  restart: ${FLUXEL_RESTART_BEHAVIOUR:-unless-stopped}
  networks: [ fluxel ]
  environment:
    UID: 1000
    GID: 1000

x-fluxel-healthcheck: &fluxel-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 90s

services:
  caddy:
    <<: *fluxel-service
    image: caddy:2.11-alpine
    ports:
      - "127.0.0.1:2400:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      <<: *fluxel-healthcheck
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/" ]
    depends_on:
      seaweedfs: { condition: service_started }
      atlas: { condition: service_started }
      beacon: { condition: service_started }
  
  valkey:
    <<: *fluxel-service
    image: valkey/valkey:latest
    healthcheck:
      <<: *fluxel-healthcheck
      test: [ "CMD", "valkey-cli", "ping" ]
    ports:
      - "127.0.0.1:6379:6379"
  
  postgres:
    <<: *fluxel-service
    image: postgres:latest
    environment:
      POSTGRES_DB: ${DATABASE_DATABASE:-fluxel}
      POSTGRES_USER: ${DATABASE_USERNAME:-fluxel}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - ${FLUXEL_DATA_POSTGRES:-./data/postgres}:/var/lib/postgresql
    ports: [ "127.0.0.1:5432:5432" ]
    healthcheck:
      <<: *fluxel-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U fluxel" ]
  
  postgres-init:
    networks: [ fluxel ]
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Models.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *fluxel-env
  
  meilisearch:
    <<: *fluxel-service
    image: getmeili/meilisearch:latest
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: true
      MEILI_UPGRADE_DB: true
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    healthcheck:
      <<: *fluxel-healthcheck
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health" ]
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - ${FLUXEL_DATA_MEILISEARCH:-./data/meili}:/meili_data
  
  seaweedfs:
    <<: *fluxel-service
    image: chrislusf/seaweedfs:4.50
    command: [ "server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-master.telemetry=false" ]
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: 1
    healthcheck:
      <<: *fluxel-healthcheck
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz" ]
    ports:
      - "127.0.0.1:2401:8333"
      - "127.0.0.1:2402:8888"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - ${FLUXEL_DATA_SEAWEEDFS:-./data/seaweed}:/data
  
  admin:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Admin
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  api:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: API
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  atlas:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Atlas
    depends_on:
      <<: *fluxel-wait
      meilisearch: { condition: service_healthy }
    environment:
      <<: *fluxel-env
  
  beacon:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Beacon
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

  broadcast:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Broadcast
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  chronicle:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Chronicle
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env
  
  content:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Content
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

  discord:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Discord
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

  multiplayer:
    <<: *fluxel-service
    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Multiplayer
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: *fluxel-env

networks:
  fluxel:
    name: fluxel
