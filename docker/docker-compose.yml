    build:
      context: ../..
      dockerfile: ./fluxel/docker/Dockerfile
      args:
        SERVICE: Content
    depends_on:
      <<: *fluxel-wait
    environment:
      <<: [ *fluxel-db-env, *fluxel-env ]
